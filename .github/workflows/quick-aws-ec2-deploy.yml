name: quick-aws-ec2 deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'quick-aws-ec2/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Starting environment'
        required: true
        type: choice
        options:
          - dev
          - ppd
          - prd
      destroy:
        description: 'Destroy infrastructure'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    if: inputs.environment == 'dev' || inputs.environment == ''
    uses: mbasri-actions/reusable-workflows/.github/workflows/terraform-deploy.yml@main
    with:
      environment: dev
      working-directory: quick-aws-ec2
      destroy: ${{ inputs.destroy || false }}
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  deploy-ppd:
    if: always() && (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped') && inputs.environment != 'prd'
    needs: deploy-dev
    uses: mbasri-actions/reusable-workflows/.github/workflows/terraform-deploy.yml@main
    with:
      environment: ppd
      working-directory: quick-aws-ec2
      destroy: ${{ inputs.destroy || false }}
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  deploy-prd:
    if: always() && (needs.deploy-ppd.result == 'success' || needs.deploy-ppd.result == 'skipped')
    needs: deploy-ppd
    uses: mbasri-actions/reusable-workflows/.github/workflows/terraform-deploy.yml@main
    with:
      environment: prd
      working-directory: quick-aws-ec2
      destroy: ${{ inputs.destroy || false }}
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

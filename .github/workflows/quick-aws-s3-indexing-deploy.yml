name: quick-aws-s3-indexing deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'quick-aws-s3-indexing/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Starting environment'
        required: true
        type: choice
        options:
          - dev
      destroy:
        description: 'Destroy infrastructure'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    if: inputs.environment == 'dev' || inputs.environment == ''
    concurrency:
      group: ${{ github.workflow }}-deploy-dev
    uses: mbasri-actions/reusable-workflows/.github/workflows/terraform-deploy.yml@main
    with:
      environment: dev
      working-directory: quick-aws-s3-indexing
      destroy: ${{ inputs.destroy || false }}
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
